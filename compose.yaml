x-app: &app
  build: .
  environment: &environment
    SECRET_KEY: ${SECRET_KEY:-local-compose-secret-at-least-32-characters}
    DEBUG: "true"
    ALLOWED_HOSTS: localhost,127.0.0.1
    USE_SQLITE: "false"
    DB_HOST: db
    DB_PORT: "5432"
    DB_NAME: kellylab
    DB_USER: kellylab
    DB_PASSWORD: kellylab-local
    CELERY_BROKER_URL: redis://redis:6379/0
    CELERY_TASK_ALWAYS_EAGER: "false"
    AI_BACKEND: ${AI_BACKEND:-demo}
    GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    GEMINI_MODEL: ${GEMINI_MODEL:-}

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: kellylab
      POSTGRES_USER: kellylab
      POSTGRES_PASSWORD: kellylab-local
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kellylab -d kellylab"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    <<: *app
    command: python manage.py migrate --noinput
    depends_on:
      db:
        condition: service_healthy

  web:
    <<: *app
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    <<: *app
    command: celery -A config worker --loglevel=info --concurrency=2
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  postgres_data:
