# Local development. For production add compose.prod.yaml:
#   docker compose -f compose.yaml -f compose.prod.yaml up -d --build
x-app: &app
  build: .
  # Every setting from .env reaches the containers; `environment` below overrides
  # the values that must differ inside Docker (database, Redis and service hosts).
  env_file:
    - path: .env
      required: false
  environment: &environment
    SECRET_KEY: ${SECRET_KEY:-local-compose-secret-at-least-32-characters}
    DEBUG: "true"
    ALLOWED_HOSTS: localhost,127.0.0.1
    USE_SQLITE: "false"
    DB_HOST: db
    DB_PORT: "5432"
    DB_NAME: kellylab
    DB_USER: kellylab
    DB_PASSWORD: kellylab-local
    CELERY_BROKER_URL: redis://redis:6379/0
    CACHE_URL: redis://redis:6379/1
    CELERY_TASK_ALWAYS_EAGER: "false"
    # The FastAPI services below, reached by their service names.
    PARSER_URL: http://parser:8001
    EXPORTER_URL: http://exporter:8002
    RUNNER_URL: http://runner:8003

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: kellylab
      POSTGRES_USER: kellylab
      POSTGRES_PASSWORD: kellylab-local
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kellylab -d kellylab"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    <<: *app
    command: python manage.py migrate --noinput
    depends_on:
      db:
        condition: service_healthy

  web:
    <<: *app
    ports:
      - "127.0.0.1:8000:8000"
    # The slim image has no curl; urlopen raises on 503, so the check fails when the database or Redis is down.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    # The worker writes export files and web serves them, so both share one volume.
    volumes:
      - media:/app/media
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      # PDF/DOCX import calls it during the request; without it only that import fails (503).
      parser:
        condition: service_started

  worker:
    <<: *app
    command: celery -A config worker -Q celery --loglevel=info --concurrency=2
    # The worker answers a ping through Redis only while it is alive and consuming its queue.
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME --timeout 10"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 30s
    volumes:
      - media:/app/media
    # `sandbox` only to reach the runner, which has no other network.
    networks:
      - default
      - sandbox
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      exporter:
        condition: service_started
      runner:
        condition: service_started

  worker-ai:
    <<: *app
    command: celery -A config worker -Q ai --loglevel=info --concurrency=1 --prefetch-multiplier=1 -n ai@%h
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d ai@$$HOSTNAME --timeout 10"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Sends the daily cleanup tasks to the `celery` queue; run exactly one.
  beat:
    <<: *app
    command: celery -A config beat --loglevel=info --schedule /tmp/celerybeat-schedule
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # PDF/DOCX import: web sends the uploaded file here and gets the list of questions back.
  parser:
    build: ./parser
    # The Parser has no health endpoint, so the check only opens its port.
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8001), timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # PDF/DOCX export: the worker sends the questions with answers and saves the file it gets back.
  exporter:
    build: ./exporter
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Runs submitted solutions for the worker (POST /run). Each test runs as an unprivileged
  # sandbox user with CPU, memory and process limits (runner/main.py); the container adds the rest.
  runner:
    build: ./runner
    # Reaps processes that the tested code leaves behind.
    init: true
    read_only: true
    # The only writable place: a private folder per run, deleted after it.
    tmpfs:
      - /sandbox:size=64m,mode=711
    # Root in the container is needed only to start the code as a sandbox user.
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    ipc: none
    pids_limit: 128
    mem_limit: 768m
    cpus: 2
    networks:
      - sandbox
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  default:
  # No route outside, so the runner and the code it runs cannot reach the internet.
  # Only the worker joins it, to call the runner.
  sandbox:
    internal: true

volumes:
  postgres_data:
  media:
