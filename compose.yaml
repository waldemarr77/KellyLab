x-app: &app
  build: .
  # Every setting from .env reaches the containers; `environment` below overrides
  # the values that must differ inside Docker (database, Redis, Exporter hosts).
  env_file:
    - path: .env
      required: false
  environment: &environment
    SECRET_KEY: ${SECRET_KEY:-local-compose-secret-at-least-32-characters}
    DEBUG: "true"
    ALLOWED_HOSTS: localhost,127.0.0.1
    USE_SQLITE: "false"
    DB_HOST: db
    DB_PORT: "5432"
    DB_NAME: kellylab
    DB_USER: kellylab
    DB_PASSWORD: kellylab-local
    CELERY_BROKER_URL: redis://redis:6379/0
    CACHE_URL: redis://redis:6379/1
    CELERY_TASK_ALWAYS_EAGER: "false"
    # Exporter running on the host (uvicorn on port 8002) until it gets its own service here.
    EXPORTER_URL: ${COMPOSE_EXPORTER_URL:-http://host.docker.internal:8002}
  extra_hosts:
    - host.docker.internal:host-gateway

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: kellylab
      POSTGRES_USER: kellylab
      POSTGRES_PASSWORD: kellylab-local
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kellylab -d kellylab"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    <<: *app
    command: python manage.py migrate --noinput
    depends_on:
      db:
        condition: service_healthy

  web:
    <<: *app
    ports:
      - "127.0.0.1:8000:8000"
    # The worker writes export files and web serves them, so both share one volume.
    volumes:
      - media:/app/media
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    <<: *app
    command: celery -A config worker -Q celery --loglevel=info --concurrency=2
    volumes:
      - media:/app/media
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker-ai:
    <<: *app
    command: celery -A config worker -Q ai --loglevel=info --concurrency=1 --prefetch-multiplier=1 -n ai@%h
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Sends the daily cleanup tasks to the `celery` queue; run exactly one.
  beat:
    <<: *app
    command: celery -A config beat --loglevel=info --schedule /tmp/celerybeat-schedule
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  media:
