name: Django CI

on:
  push:
    branches: [ main, dev, feature/django-backend ]
  pull_request:
    branches: [ main, dev ]

# The jobs only read the code; a compromised action cannot push or change the repository.
permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      - name: Install pip-audit
        run: pip install -c requirements-dev.txt pip-audit

      - name: Check dependencies for known vulnerabilities
        run: pip-audit -r requirements.txt

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: kellylab
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_NAME: kellylab
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: 5432
      SECRET_KEY: ci-test-secret-key-at-least-32-characters
      CELERY_TASK_ALWAYS_EAGER: "true"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt -c requirements-dev.txt coverage

      - name: Check migration consistency
        run: python manage.py makemigrations --check --dry-run

      - name: Run migrations
        run: python manage.py migrate

      - name: Run tests
        run: coverage run manage.py test

      # The table goes to the run's Summary page; the second report prints it to the log
      # and fails the job below fail_under from .coveragerc.
      - name: Coverage report
        run: |
          coverage report --format=markdown --fail-under=0 >> "$GITHUB_STEP_SUMMARY"
          coverage report

  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build image
        run: docker build -t kellylab:ci .

      # Catches a package missing from the image or settings that fail to load inside it.
      - name: Run Django checks in the image
        run: docker run --rm -e SECRET_KEY=ci-docker-check-secret-key-at-least-32-characters kellylab:ci python manage.py check
