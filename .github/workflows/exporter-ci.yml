name: Exporter CI

on:
  push:
    branches: [dev, main, "feature/**"]
    paths:
      - "exporter/**"
  pull_request:
    branches: [dev, main]
    paths:
      - "exporter/**"

jobs:
  test:
    name: pytest + ruff
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install fonts
        run: sudo apt-get install -y fonts-dejavu-core

      - name: Install dependencies
        run: pip install -r exporter/requirements.txt ruff

      - name: ruff lint
        run: ruff check exporter/

      - name: pytest
        run: pytest exporter/tests -v
        env:
          PYTHONPATH: exporter
