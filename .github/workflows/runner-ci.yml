name: Runner CI

on:
  push:
    branches: [dev, main, "feature/**"]
    paths:
      - "runner/**"
  pull_request:
    branches: [dev, main]
    paths:
      - "runner/**"

jobs:
  test:
    name: pytest (in container) + ruff
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ruff lint
        run: |
          pip install ruff
          ruff check runner/

      - name: Build image
        run: docker build -t kellylab-runner:ci runner/

      # Run the sandbox tests inside the image, as root, with the same isolation as production:
      # the privilege drop to the sandbox user only happens here, not for a plain non-root pytest.
      - name: pytest
        run: |
          docker run --rm \
            --pids-limit=256 --memory=1g \
            --tmpfs /sandbox:size=64m,mode=711 -e SANDBOX_DIR=/sandbox \
            -v "${{ github.workspace }}/runner/tests:/app/tests:ro" \
            kellylab-runner:ci python -m pytest tests -v
